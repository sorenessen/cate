name: verify

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CATE
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run smoke verify
        run: |
          ./scripts/verify.sh
