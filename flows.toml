[flows.example-login-cli-vars]
description = "Login using CLI username/password with CSRF token, then fetch about page."
steps = ["get-login", "login", "about"]

[flows.example-login-cli-vars.get-login]
method = "GET"
url = "https://example.com/login.php"
capture_cookies = true
extract_regex = 'name="csrf_token" value="([^"]+)"'
store_as = "csrf"
require_extracted = true

[flows.example-login-cli-vars.login]
method = "POST"
url = "https://example.com/login.php"
capture_cookies = true
headers = { Content-Type = "application/x-www-form-urlencoded" }
body_template = "csrf_token={csrf}&redirect=%2Fabout.html&username={username}&password={password}&action=login"
expect_status = 200
body_must_not_contain = "Login or Sign Up"

[flows.example-login-cli-vars.about]
method = "GET"
url = "https://example.com/about.html"
expect_status = 200
body_must_not_contain = "Login or Sign Up"


