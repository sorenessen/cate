# Demo flows for local testing:
# include = ["flows/demo-flows.toml"]


[flows.delphonix-login-sequence]
description = "Login as admin, then fetch about page."

# Step order
steps = ["login", "about"]

[flows.delphonix-login-sequence.login]
method = "POST"
url = "https://delphonix.com/login.php"
body_template = "user=admin&pass={password}"
capture_cookies = true
stop_on_fail = false

[flows.delphonix-login-sequence.about]
method = "GET"
url = "https://delphonix.com/about.html"
expect_status = 200
max_latency_ms = 500.0          # TEST: or 1000.0
body_must_contain = "About"     # TEST: proves the page loaded
# body_must_not_contain = "Dashboard" # TEST: not forbidden


# ---------------------------------------------------------
# Demo flow with variable extraction & reuse
# ---------------------------------------------------------
[flows.delphonix-login-sequence-vars]
description = "Login as admin, then fetch about page (with variable extraction demo)."
steps = ["login", "about", "echo"]

[flows.delphonix-login-sequence-vars.login]
method = "POST"
url = "https://delphonix.com/login.php"
body_template = "user=admin&pass={password}"
capture_cookies = true

# Extract a marker string from the login page and store it
extract_regex = "Login or Sign Up"
# max_latency_ms = 1.0
store_as = "marker"
require_extracted = true   # <— NEW: fail step if regex doesn't match

[flows.delphonix-login-sequence-vars.about]
method = "GET"
url = "https://delphonix.com/about.html?m={marker}"
expect_status = 200

[flows.delphonix-login-sequence-vars.echo]
method = "GET"
url = "https://delphonix.com/about.html?marker={urlencode(marker)}&step=echo"
expect_status = 200
body_must_contain = "About"
headers = { X-CATE-Marker = "{marker}" }

[flows.delphonix-login-cli-vars]
description = "Login using CLI-provided username/password, then fetch about page."
steps = ["login", "about"]

[flows.delphonix-login-cli-vars.login]
method = "POST"
url = "https://delphonix.com/login.php"
headers = { Content-Type = "application/x-www-form-urlencoded" }
body_template = "username={username}&password={password}"
capture_cookies = true
expect_status = 200
body_must_not_contain = "Login or Sign Up"


[flows.delphonix-login-cli-vars.about]
method = "GET"
url = "https://delphonix.com/about.php"
expect_status = 200
body_must_not_contain = "Login or Sign Up"



