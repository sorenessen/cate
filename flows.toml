# Demo flows for local testing:
# include = ["flows/demo-flows.toml"]


[flows.example-login-sequence]
description = "Login as admin, then fetch about page."

# Step order
steps = ["login", "about"]

[flows.example-login-sequence.login]
method = "POST"
url = "https://example.com/login.php"
body_template = "user=admin&pass={password}"
capture_cookies = true
stop_on_fail = false

[flows.example-login-sequence.about]
method = "GET"
url = "https://example.com/about.html"
expect_status = 200
max_latency_ms = 500.0          # TEST: or 1000.0
body_must_contain = "About"     # TEST: proves the page loaded
# body_must_not_contain = "Dashboard" # TEST: not forbidden


