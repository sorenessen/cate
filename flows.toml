[flows.delphonix-login-cli-vars]
description = "Login using CLI-provided username/password (real CSRF + cookies), then verify auth."
steps = ["get_login", "login", "profile"]
follow_redirects = false

[flows.delphonix-login-cli-vars.get_login]
method = "GET"
url = "https://delphonix.com/login.php"
expect_status = 200
capture_cookies = true
extract_regex = "name=\"csrf_token\" value=\"([^\"]+)\""
store_as = "csrf_token"
require_extracted = true

[flows.delphonix-login-cli-vars.login]
method = "POST"
url = "https://delphonix.com/login.php"
expect_status = [302]
capture_cookies = true
headers = { "Content-Type" = "application/x-www-form-urlencoded" }
body_template = "csrf_token={csrf_token}&redirect=/about.html&username={username}&password={password}&action=login"

# These assertions are the “session proof” inside CATE:
cookie_must_exist = ["dfx_user", "dfx_profile"]
header_must_exist = ["location", "set-cookie"]
header_must_contain = { "location" = "/about.html" }

[flows.delphonix-login-cli-vars.profile]
method = "GET"
url = "https://delphonix.com/profile.php?u={username}"
expect_status = 200
capture_cookies = true
cookie_must_exist = ["dfx_user"]
