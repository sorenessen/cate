[flows.demo-json-token]
description = "Demo: extract id from JSON and reuse it."
steps = ["get-todo", "use-id"]

# Step 1: fetch a known JSON resource
[flows.demo-json-token.get-todo]
method = "GET"
url = "https://jsonplaceholder.typicode.com/todos/1"
expect_status = 200
# Response JSON looks like:
# {
#   "userId": 1,
#   "id": 1,
#   "title": "...",
#   "completed": false
# }
extract_json = "id"
store_as = "todo_id"
require_extracted = true

# Header assertions
header_must_exist = ["Content-Type"]
header_must_contain = { "Content-Type" = "application/json" }

# Step 2: use the extracted id in another request
[flows.demo-json-token.use-id]
method = "GET"
url = "https://jsonplaceholder.typicode.com/todos/{todo_id}"
expect_status = 200

# headers extract flows

[flows.demo-header-extract]
description = "Demo: extract a header and reuse it."
steps = ["head-todo", "use-etag"]

# Step 1: head request to get headers only
[flows.demo-header-extract.head-todo]
method = "HEAD"
url = "https://jsonplaceholder.typicode.com/todos/1"
expect_status = 200
extract_header = "ETag"
store_as = "etag"
require_extracted = true

[flows.demo-header-extract.use-etag]
method = "GET"
url = "https://jsonplaceholder.typicode.com/todos/1"
# expect_status = 200 Temporarily Disabled Expectation
headers = { "If-None-Match" = "{etag}" }

